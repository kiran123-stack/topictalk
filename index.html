    <script>
      // Suppress harmless Vite dev server websocket rejection in AI Studio iframe
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (
          (event.reason.message && event.reason.message.includes('WebSocket')) ||
          (typeof event.reason === 'string' && event.reason.includes('WebSocket')) ||
          (event.reason.toString && event.reason.toString().includes('WebSocket'))
        )) {
          event.preventDefault();
        }
      });
    </script>

  </body>
